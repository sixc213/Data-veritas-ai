<!DOCTYPE html>
<html>
<head>
    <title>Veritas Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Login to Veritas</h1>

        <input
            id="email"
            placeholder="Email">

        <input
            id="password"
            type="password"
            placeholder="Password">

        <button onclick="login()">
            Login
        </button>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
