<!DOCTYPE html>
<html>
<head>
    <title>Veritas AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Veritas AI</h1>

        <p>
            AI-Powered Data Intelligence
            Infrastructure
        </p>

        <a href="login.html">
            <button>
                Get Started
            </button>
        </a>

    </div>

</div>

</html>
<script>

function uploadData(){

    let file =
        document.getElementById("dataset").files[0];

    if(!file){
        alert("Select a file first");
        return;
    }

    document.getElementById("uploadStatus")
        .innerHTML =
        "Dataset uploaded successfully (demo mode)";
}

function askAI(){

    let question =
        document.getElementById("question").value;

    if(question === ""){
        return;
    }

    let chat =
        document.getElementById("chat");

    chat.innerHTML +=
    `<div class="message user">
        ${question}
    </div>`;

    setTimeout(()=>{

        chat.innerHTML +=
        `<div class="message ai">
            Veritas AI Response:
            This is where AI analysis will appear.
        </div>`;

    },500);
}

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>

</body>
</html>
