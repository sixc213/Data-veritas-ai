<!DOCTYPE html>
<html>
<head>
    <title>Veritas AI</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#0f172a;
            color:white;
            margin:0;
        }

        header{
            padding:20px;
            text-align:center;
            background:#1e293b;
        }

        .container{
            width:90%;
            max-width:1000px;
            margin:auto;
            padding:20px;
        }

        .card{
            background:#1e293b;
            padding:20px;
            border-radius:10px;
            margin-top:20px;
        }

        input,button{
            padding:10px;
            margin-top:10px;
        }

        button{
            cursor:pointer;
        }

        #chat{
            margin-top:20px;
            min-height:200px;
        }

        .message{
            padding:10px;
            margin:10px 0;
            border-radius:8px;
        }

        .user{
            background:#2563eb;
        }

        .ai{
            background:#334155;
        }
    </style>
</head>

<body>

<header>
    <h1>Veritas AI</h1>
    <p>AI-Powered Data Intelligence Platform</p>
</header>

<div class="container">

    <div class="card">
        <h2>Upload Dataset</h2>

        <input type="file" id="dataset">

        <br>

        <button onclick="uploadData()">
            Upload
        </button>

        <p id="uploadStatus"></p>
    </div>

    <div class="card">

        <h2>Ask Veritas</h2>

        <input
            type="text"
            id="question"
            placeholder="Ask about your data..."
            style="width:80%;"
        >

        <button onclick="askAI()">
            Ask
        </button>

        <div id="chat"></div>

    </div>

</div>

<script>

function uploadData(){

    let file =
        document.getElementById("dataset").files[0];

    if(!file){
        alert("Select a file first");
        return;
    }

    document.getElementById("uploadStatus")
        .innerHTML =
        "Dataset uploaded successfully (demo mode)";
}

function askAI(){

    let question =
        document.getElementById("question").value;

    if(question === ""){
        return;
    }

    let chat =
        document.getElementById("chat");

    chat.innerHTML +=
    `<div class="message user">
        ${question}
    </div>`;

    setTimeout(()=>{

        chat.innerHTML +=
        `<div class="message ai">
            Veritas AI Response:
            This is where AI analysis will appear.
        </div>`;

    },500);
}

</script>

</body>
</html>
